000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="234" x="828.5" y="890.995">encuadrar y reconstruir ecos simulados</text><polygon fill="#A80036" points="66.5,937.51,56.5,941.51,66.5,945.51,62.5,941.51" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="60.5" x2="820.5" y1="941.51" y2="941.51"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="127" x="72.5" y="935.701">Status + diagnósticos</text><path d="M667,961.51 L667,1024.51 L976,1024.51 L976,971.51 L966,961.51 L667,961.51 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M966,961.51 L966,971.51 L976,971.51 L966,961.51 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="270" x="673" y="980.4071">ChartStreamer reutiliza esta preparación CPU</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="264" x="673" y="998.1131">y confirma desde poll, sin cambiar la cámara.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="288" x="673" y="1015.8191">Ver streaming.puml para el recorrido por región.</text><!--MD5=[837ba7611fbe3457c116f8a7081c8d35]
@startuml
title ENC SDK — indexación y carga
skinparam shadowing false
actor "Anfitrión" as host
participant Catalog
participant "Sistema de archivos" as fs
participant "GDAL S57" as gdal
participant Viewer
participant "Escena temporal" as staging
host -> Catalog : scan(carpeta)
Catalog -> fs : recorrer .000 / normalizar / ordenar
loop cada base
  Catalog -> fs : buscar actualizaciones vecinas
  Catalog -> gdal : abrir base con UPDATES=APPLY
  gdal - -> Catalog : DSID, escala y cobertura M_COVR
  Catalog -> host : progreso / posibilidad de cancelar
end
Catalog - -> host : Status + catálogo consultable
host -> Catalog : query(región) / cells()
Catalog - -> host : celdas elegidas
host -> Viewer : loadCells(rutas)
loop cada celda
  Viewer -> host : progreso / posibilidad de cancelar
  Viewer -> gdal : leer atributos y geometrías
  gdal - -> Viewer : objetos WGS84
  Viewer -> staging : copiar / teselar / conservar cobertura
end
alt cancelación o fallo estricto
  Viewer -> staging : descartar
  Viewer - -> host : error; escena anterior conservada
else carga confirmada
  Viewer -> staging : decodificar símbolos y asociar equipos
  Viewer -> Viewer : reemplazar ENC / invalidar FeatureId
  Viewer -> Viewer : conservar TIFF, contactos y preferencias
  Viewer -> Viewer : encuadrar y reconstruir ecos simulados
  Viewer - -> host : Status + diagnósticos
end
note over Viewer
  ChartStreamer reutiliza esta preparación CPU
  y confirma desde poll, sin cambiar la cámara.
  Ver streaming.puml para el recorrido por región.
end note
@enduml

